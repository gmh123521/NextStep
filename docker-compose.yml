services:
  mysql:
    image: mysql:8.0
    container_name: nextstep-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nextstep
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password

  redis:
    image: redis:7-alpine
    container_name: nextstep-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes

  backend:
    build: .
    container_name: nextstep-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: nextstep
      MYSQL_USER: root
      MYSQL_PWD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
      CRAWLER_KAOYAN_DATA_YEAR: ${CRAWLER_KAOYAN_DATA_YEAR:-2026}
      CRAWLER_GOV_POST_DATA_YEAR: ${CRAWLER_GOV_POST_DATA_YEAR:-2026}
      CRAWLER_KAOYAN_URL: ${CRAWLER_KAOYAN_URL:-https://yz.chsi.com.cn/zsml/pages/getMl.jsp}
      CRAWLER_GOV_POST_URL: ${CRAWLER_GOV_POST_URL:-http://www.scs.gov.cn/kl2023/kl/zwb/index.json}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    depends_on:
      - mysql
      - redis
    volumes:
      - ./data/crawler-raw:/app/data/crawler-raw
