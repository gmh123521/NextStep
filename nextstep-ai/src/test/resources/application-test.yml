spring:
  profiles: test
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:nextstep_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/*.sql
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: 0
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

nextstep:
  jwt:
    secret: test-secret-key-min-32-bytes-long-enough
    expire-millis: 7200000
  ai:
    api-key: test-fake-key
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    text-model: qwen3.7-plus
    vision-model: qwen-vl-plus
    max-tokens: 600
    timeout-seconds: 30
    temperature: 0.7

logging:
  level:
    root: WARN
    com.nextstep: DEBUG